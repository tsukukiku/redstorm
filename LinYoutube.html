<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundFlow - 纯音频流媒体播放器</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg-primary:#0a0a0f;--bg-secondary:#12121a;--bg-surface:#1a1a2e;
            --bg-hover:#252540;--text-primary:#ffffff;--text-secondary:#a0a0b8;
            --text-muted:#6c6c80;--accent-1:#7c3aed;--accent-2:#ec4899;
            --accent-gradient:linear-gradient(135deg,#7c3aed,#ec4899);
            --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
            --border:#2a2a40;--radius:12px;--radius-sm:8px;
            --shadow:0 8px 32px rgba(0,0,0,0.4);--transition:0.3s cubic-bezier(0.4,0,0.2,1)
        }
        html{font-size:16px}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:var(--bg-primary);color:var(--text-primary);
            min-height:100vh;overflow-x:hidden;line-height:1.5
        }
        a{color:inherit;text-decoration:none}
        button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
        input{font-family:inherit;outline:none;border:none}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

        /* ===== HEADER ===== */
        .header{
            position:fixed;top:0;left:0;right:0;z-index:100;
            background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);padding:0 24px;
            height:64px;display:flex;align-items:center;justify-content:space-between
        }
        .header-left{display:flex;align-items:center;gap:16px}
        .logo{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:700}
        .logo-icon{
            width:36px;height:36px;background:var(--accent-gradient);border-radius:10px;
            display:flex;align-items:center;justify-content:center;font-size:1.1rem
        }
        .logo span{background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-stats{display:flex;align-items:center;gap:20px}
        .stat-item{display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--text-secondary)}
        .stat-item i{color:var(--accent-1);font-size:0.9rem}
        .stat-item .saved{color:var(--success);font-weight:600}
        .header-actions{display:flex;align-items:center;gap:10px}
        .btn{
            padding:8px 18px;border-radius:var(--radius-sm);font-size:0.85rem;font-weight:500;
            transition:var(--transition);display:flex;align-items:center;gap:6px;white-space:nowrap
        }
        .btn-primary{background:var(--accent-gradient);color:#fff}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,0.4)}
        .btn-ghost{background:var(--bg-surface);color:var(--text-secondary);border:1px solid var(--border)}
        .btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
        .btn-icon{
            width:38px;height:38px;border-radius:var(--radius-sm);display:flex;
            align-items:center;justify-content:center;font-size:1rem;color:var(--text-secondary);
            transition:var(--transition)
        }
        .btn-icon:hover{background:var(--bg-hover);color:var(--text-primary)}

        /* ===== MAIN LAYOUT ===== */
        .app{display:flex;height:100vh;padding-top:64px}
        .sidebar{
            width:360px;min-width:360px;background:var(--bg-secondary);
            border-right:1px solid var(--border);display:flex;flex-direction:column;
            overflow:hidden;transition:var(--transition)
        }
        .sidebar.collapsed{width:0;min-width:0;border:none}
        .sidebar-toggle{
            position:absolute;top:80px;left:360px;z-index:90;
            width:28px;height:56px;background:var(--bg-surface);border:1px solid var(--border);
            border-left:none;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
            display:flex;align-items:center;justify-content:center;color:var(--text-muted);
            transition:var(--transition);font-size:0.75rem
        }
        .sidebar.collapsed~.sidebar-toggle{left:0}
        .sidebar-toggle:hover{color:var(--text-primary);background:var(--bg-hover)}

        /* ===== SEARCH & ADD ===== */
        .sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
        .search-box{
            display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border);
            border-radius:var(--radius-sm);padding:10px 14px;gap:10px;transition:var(--transition)
        }
        .search-box:focus-within{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
        .search-box i{color:var(--text-muted);font-size:0.9rem}
        .search-box input{flex:1;background:none;color:var(--text-primary);font-size:0.9rem}
        .search-box input::placeholder{color:var(--text-muted)}
        .add-url-row{display:flex;gap:8px;margin-top:12px}
        .add-url-row input{
            flex:1;background:var(--bg-surface);border:1px solid var(--border);
            border-radius:var(--radius-sm);padding:8px 12px;color:var(--text-primary);font-size:0.82rem
        }
        .add-url-row input::placeholder{color:var(--text-muted)}
        .add-url-row input:focus{border-color:var(--accent-1)}

        /* ===== VIDEO LIST ===== */
        .video-list{flex:1;overflow-y:auto;padding:12px}
        .video-item{
            display:flex;gap:12px;padding:10px;border-radius:var(--radius-sm);cursor:pointer;
            transition:var(--transition);margin-bottom:4px;position:relative
        }
        .video-item:hover{background:var(--bg-hover)}
        .video-item.active{background:var(--bg-surface);border:1px solid var(--border)}
        .video-item.active::before{
            content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
            background:var(--accent-gradient);border-radius:0 2px 2px 0
        }
        .thumb{
            width:160px;min-width:160px;height:90px;border-radius:6px;position:relative;
            overflow:hidden;background:var(--bg-primary);flex-shrink:0
        }
        .thumb img{width:100%;height:100%;object-fit:cover}
        .thumb .duration{
            position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.8);color:#fff;
            font-size:0.72rem;padding:2px 6px;border-radius:3px;font-weight:500
        }
        .thumb .audio-badge{
            position:absolute;top:4px;left:4px;background:rgba(124,58,237,0.9);color:#fff;
            font-size:0.62rem;padding:2px 6px;border-radius:3px;font-weight:600;
            display:flex;align-items:center;gap:3px
        }
        .video-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
        .video-title{
            font-size:0.88rem;font-weight:500;line-height:1.4;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
            overflow:hidden;color:var(--text-primary)
        }
        .video-channel{font-size:0.78rem;color:var(--text-muted);margin-top:4px}
        .video-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
        .video-views{font-size:0.75rem;color:var(--text-muted)}

        /* ===== MAIN PLAYER AREA ===== */
        .player-area{
            flex:1;display:flex;flex-direction:column;position:relative;
            background:var(--bg-primary);overflow:hidden
        }
        .youtube-player{position:absolute;width:320px;height:180px;opacity:0;pointer-events:none;z-index:0}

        /* ===== WELCOME SCREEN ===== */
        .welcome{
            flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:24px;position:relative;z-index:2;padding:40px
        }
        .welcome-icon{
            width:100px;height:100px;background:var(--accent-gradient);border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-size:2.5rem;
            animation:float 3s ease-in-out infinite
        }
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        .welcome h2{font-size:1.8rem;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .welcome p{color:var(--text-muted);font-size:1rem;text-align:center;max-width:400px}

        /* ===== EQUALIZER ===== */
        .equalizer{display:flex;align-items:flex-end;gap:4px;height:60px}
        .eq-bar{
            width:6px;background:var(--accent-gradient);border-radius:3px;
            animation:eqBounce 0.8s ease-in-out infinite alternate
        }
        .eq-bar:nth-child(1){height:20px;animation-delay:0s}
        .eq-bar:nth-child(2){height:40px;animation-delay:0.1s}
        .eq-bar:nth-child(3){height:30px;animation-delay:0.2s}
        .eq-bar:nth-child(4){height:50px;animation-delay:0.3s}
        .eq-bar:nth-child(5){height:25px;animation-delay:0.4s}
        .eq-bar:nth-child(6){height:45px;animation-delay:0.5s}
        .eq-bar:nth-child(7){height:35px;animation-delay:0.6s}
        @keyframes eqBounce{0%{transform:scaleY(0.4)}100%{transform:scaleY(1)}}
        .welcome.hidden,.player-screen.hidden{display:none}

        /* ===== PLAYER SCREEN ===== */
        .player-screen{
            flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:40px;position:relative;z-index:2;gap:32px
        }
        .album-art{
            width:280px;height:280px;border-radius:var(--radius);position:relative;overflow:hidden;
            box-shadow:0 20px 60px rgba(124,58,237,0.3);animation:albumGlow 3s ease-in-out infinite
        }
        @keyframes albumGlow{0%,100%{box-shadow:0 20px 60px rgba(124,58,237,0.3)}50%{box-shadow:0 20px 80px rgba(236,72,153,0.3)}}
        .album-art img{width:100%;height:100%;object-fit:cover}
        .album-art-overlay{
            position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,0.8),transparent 60%)
        }
        .album-art .play-overlay{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,0.3);opacity:0;transition:var(--transition)
        }
        .album-art:hover .play-overlay{opacity:1}
        .play-overlay-btn{
            width:64px;height:64px;background:rgba(255,255,255,0.95);border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--bg-primary);
            box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:var(--transition)
        }
        .play-overlay-btn:hover{transform:scale(1.1)}

        /* ===== TRACK INFO ===== */
        .track-info{text-align:center}
        .track-title{font-size:1.6rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:500px}
        .track-channel{font-size:1rem;color:var(--text-muted)}
        .data-saved-badge{
            display:inline-flex;align-items:center;gap:6px;margin-top:12px;
            background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);
            color:var(--success);padding:6px 14px;border-radius:20px;font-size:0.82rem;font-weight:500
        }

        /* ===== VISUALIZER ===== */
        .visualizer{display:flex;align-items:flex-end;gap:3px;height:80px;padding:0 20px}
        .viz-bar{
            width:8px;border-radius:4px;background:var(--accent-gradient);
            animation:vizBounce 1s ease-in-out infinite alternate
        }
        .viz-bar:nth-child(odd){animation-duration:0.6s}
        .viz-bar:nth-child(3n){animation-duration:0.8s}
        .viz-bar:nth-child(5n){animation-duration:1.2s}
        @keyframes vizBounce{0%{height:10%}100%{height:90%}}

        /* ===== PROGRESS BAR ===== */
        .progress-section{padding:0 40px;width:100%;max-width:600px}
        .progress-time{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-bottom:6px}
        .progress-track{
            width:100%;height:6px;background:var(--bg-surface);border-radius:3px;cursor:pointer;
            position:relative;overflow:hidden;transition:height 0.15s
        }
        .progress-track:hover{height:8px}
        .progress-buffered{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,0.1);border-radius:3px}
        .progress-fill{
            height:100%;background:var(--accent-gradient);border-radius:3px;position:relative;
            transition:width 0.1s linear;width:0%
        }
        .progress-fill::after{
            content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);
            width:14px;height:14px;background:#fff;border-radius:50%;
            box-shadow:0 2px 8px rgba(0,0,0,0.3);opacity:0;transition:opacity 0.15s
        }
        .progress-track:hover .progress-fill::after{opacity:1}

        /* ===== CONTROLS ===== */
        .controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px 0}
        .ctrl-btn{
            width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            color:var(--text-secondary);font-size:1.1rem;transition:var(--transition)
        }
        .ctrl-btn:hover{color:var(--text-primary);background:var(--bg-hover)}
        .ctrl-btn.play-main{
            width:56px;height:56px;background:var(--text-primary);color:var(--bg-primary);
            font-size:1.3rem
        }
        .ctrl-btn.play-main:hover{transform:scale(1.08);box-shadow:0 4px 20px rgba(255,255,255,0.2)}
        .volume-control{display:flex;align-items:center;gap:8px;margin-left:20px}
        .volume-slider{
            width:100px;height:4px;-webkit-appearance:none;appearance:none;background:var(--bg-surface);
            border-radius:2px;outline:none;cursor:pointer
        }
        .volume-slider::-webkit-slider-thumb{
            -webkit-appearance:none;width:14px;height:14px;background:#fff;border-radius:50%;
            box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer
        }
        .volume-slider::-moz-range-thumb{
            width:14px;height:14px;background:#fff;border-radius:50%;border:none;
            box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer
        }
        .playback-speed{
            padding:4px 10px;background:var(--bg-surface);border-radius:12px;
            font-size:0.78rem;color:var(--text-secondary);margin-left:16px;cursor:pointer;
            border:1px solid var(--border);transition:var(--transition)
        }
        .playback-speed:hover{border-color:var(--accent-1);color:var(--text-primary)}

        /* ===== NOW PLAYING BAR ===== */
        .now-playing{
            position:absolute;bottom:0;left:0;right:0;z-index:50;
            background:rgba(18,18,26,0.95);backdrop-filter:blur(20px);
            border-top:1px solid var(--border);padding:10px 20px;
            display:flex;align-items:center;gap:16px;transition:transform 0.3s;
            transform:translateY(100%)
        }
        .now-playing.show{transform:translateY(0)}
        .np-thumb{width:48px;height:48px;border-radius:6px;overflow:hidden;flex-shrink:0}
        .np-thumb img{width:100%;height:100%;object-fit:cover}
        .np-info{flex:1;min-width:0}
        .np-title{font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .np-channel{font-size:0.75rem;color:var(--text-muted)}
        .np-controls{display:flex;align-items:center;gap:8px}
        .np-progress{width:200px;display:flex;align-items:center;gap:8px}
        .np-time{font-size:0.72rem;color:var(--text-muted);white-space:nowrap}
        .np-progress .progress-track{height:4px}
        .np-progress .progress-fill{height:100%}
        .np-progress .progress-fill::after{display:none}

        /* ===== MODAL ===== */
        .modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
            z-index:200;display:none;align-items:center;justify-content:center;padding:20px
        }
        .modal-overlay.show{display:flex}
        .modal{
            background:var(--bg-surface);border-radius:var(--radius);padding:28px;
            width:100%;max-width:480px;box-shadow:var(--shadow);border:1px solid var(--border)
        }
        .modal h3{font-size:1.2rem;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
        .modal-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:var(--transition)}
        .modal-close:hover{background:var(--bg-hover);color:var(--text-primary)}
        .modal-input{width:100%;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;color:var(--text-primary);font-size:0.95rem;margin-bottom:12px}
        .modal-input:focus{border-color:var(--accent-1)}
        .modal-input::placeholder{color:var(--text-muted)}
        .modal-hint{font-size:0.8rem;color:var(--text-muted);margin-bottom:16px}
        .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

        /* ===== TOAST ===== */
        .toast-container{position:fixed;top:80px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
        .toast{
            background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);
            padding:12px 20px;font-size:0.85rem;box-shadow:var(--shadow);
            animation:toastIn 0.3s ease-out;display:flex;align-items:center;gap:10px;min-width:250px
        }
        .toast.success{border-left:3px solid var(--success)}
        .toast.info{border-left:3px solid var(--accent-1)}
        .toast.warning{border-left:3px solid var(--warning)}
        .toast.error{border-left:3px solid var(--danger)}
        @keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}

        /* ===== LISTENING MODE TOGGLE ===== */
        .mode-toggle{
            display:flex;align-items:center;gap:8px;padding:8px 14px;
            background:var(--bg-surface);border-radius:var(--radius-sm);cursor:pointer;
            transition:var(--transition);border:1px solid var(--border)
        }
        .mode-toggle:hover{border-color:var(--accent-1)}
        .mode-toggle.active{border-color:var(--accent-1);background:rgba(124,58,237,0.1)}
        .toggle-dot{
            width:12px;height:12px;border-radius:50%;background:var(--text-muted);
            transition:var(--transition)
        }
        .mode-toggle.active .toggle-dot{background:var(--success);box-shadow:0 0 8px rgba(34,197,94,0.5)}
        .mode-toggle span{font-size:0.82rem;color:var(--text-secondary)}
        .mode-toggle.active span{color:var(--success)}

        /* ===== RESPONSIVE ===== */
        @media(max-width:768px){
            .sidebar{width:100%;min-width:100%;position:absolute;left:0;top:64px;bottom:0;z-index:80}
            .sidebar.collapsed{transform:translateX(-100%)}
            .sidebar-toggle{display:none}
            .header-stats{display:none}
            .album-art{width:220px;height:220px}
            .np-progress{display:none}
            .progress-section{padding:0 20px}
            .visualizer{height:50px}
            .volume-control{display:none}
        }
        @media(max-width:480px){
            .album-art{width:180px;height:180px}
            .track-title{font-size:1.2rem}
            .controls{gap:14px}
            .ctrl-btn{width:38px;height:38px}
            .ctrl-btn.play-main{width:48px;height:48px}
        }

        /* ===== FOOTER ===== */
        .footer{
            position:absolute;bottom:60px;left:0;right:0;text-align:center;z-index:2;
            color:var(--text-muted);font-size:0.75rem;padding:8px
        }
        .footer a{color:var(--accent-1)}
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-left">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-headphones"></i></div>
            <span>SoundFlow</span>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <i class="fas fa-wifi"></i>
                <span>已节省流量</span>
                <span class="saved" id="dataSaved">0 MB</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-music"></i>
                <span>播放中</span>
                <span id="playingCount">0</span>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <div class="mode-toggle active" id="audioModeToggle" title="音频优先模式">
            <div class="toggle-dot"></div>
            <span>纯音频模式</span>
        </div>
        <button class="btn btn-ghost" onclick="toggleSidebar()">
            <i class="fas fa-list"></i> <span class="btn-label">列表</span>
        </button>
        <button class="btn btn-primary" onclick="openModal()">
            <i class="fas fa-plus"></i> <span class="btn-label">添加视频</span>
        </button>
    </div>
</header>

<!-- MAIN APP -->
<div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="搜索视频..." oninput="filterVideos()">
            </div>
            <div class="add-url-row">
                <input type="text" id="quickUrl" placeholder="粘贴YouTube链接...">
                <button class="btn btn-primary" style="padding:8px 12px" onclick="addFromQuickUrl()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
        <div class="video-list" id="videoList"></div>
    </aside>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        <i class="fas fa-chevron-" id="toggleIcon"></i>
    </button>

    <!-- PLAYER AREA -->
    <main class="player-area">
        <!-- Hidden YouTube Player -->
        <div id="youtube-player" class="youtube-player"></div>

        <!-- Welcome Screen -->
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon"><i class="fas fa-headphones"></i></div>
            <h2>SoundFlow</h2>
            <p>选择视频开始播放纯音频，节省90%+的4G流量。视频流被静默，仅播放声音。</p>
            <div class="equalizer">
                <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                <div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
                <div class="data-saved-badge"><i class="fas fa-wifi"></i> <span id="welcomeSaved">0 MB</span> 已节省</div>
                <div class="data-saved-badge" style="background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.3);color:var(--accent-1)">
                    <i class="fas fa-bolt"></i> 比视频模式节省 <b>~90%</b>
                </div>
            </div>
        </div>

        <!-- Player Screen -->
        <div class="player-screen hidden" id="playerScreen">
            <div class="album-art" id="albumArt">
                <img id="albumArtImg" src="" alt="">
                <div class="album-art-overlay"></div>
                <div class="play-overlay">
                    <button class="play-overlay-btn" id="overlayPlayBtn" onclick="togglePlay()">
                        <i class="fas fa-play" id="overlayPlayIcon"></i>
                    </button>
                </div>
            </div>

            <div class="track-info">
                <div class="track-title" id="trackTitle">视频标题</div>
                <div class="track-channel" id="trackChannel">频道名称</div>
                <div class="data-saved-badge">
                    <i class="fas fa-shield-halved"></i> 音频优先模式 - 仅传输声音流
                </div>
            </div>

            <div class="visualizer" id="visualizer">
                <!-- Generated by JS -->
            </div>

            <div class="progress-section">
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="progress-track" id="progressTrack" onclick="seekVideo(event)">
                    <div class="progress-buffered" id="bufferedBar"></div>
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevVideo()" title="上一首"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn play-main" onclick="togglePlay()" title="播放/暂停">
                    <i class="fas fa-play" id="mainPlayIcon"></i>
                </button>
                <button class="ctrl-btn" onclick="nextVideo()" title="下一首"><i class="fas fa-step-forward"></i></button>
                <div class="volume-control">
                    <i class="fas fa-volume-high" id="volIcon" style="color:var(--text-muted);font-size:0.9rem"></i>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
                </div>
                <button class="playback-speed" id="speedBtn" onclick="cycleSpeed()">1.0x</button>
            </div>
        </div>

        <!-- NOW PLAYING BAR -->
        <div class="now-playing" id="nowPlayingBar">
            <div class="np-thumb">
                <img id="npThumb" src="" alt="">
            </div>
            <div class="np-info">
                <div class="np-title" id="npTitle">视频标题</div>
                <div class="np-channel" id="npChannel">频道名称</div>
            </div>
            <div class="np-progress">
                <span class="np-time" id="npCurrent">0:00</span>
                <div class="progress-track" onclick="seekVideo(event)" style="width:200px">
                    <div class="progress-fill" id="npProgressFill" style="width:0%"></div>
                </div>
                <span class="np-time" id="npTotal">0:00</span>
            </div>
            <div class="np-controls">
                <button class="ctrl-btn" onclick="prevVideo()" style="width:32px;height:32px;font-size:0.8rem"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn" onclick="togglePlay()" style="width:36px;height:36px;font-size:0.9rem" id="npPlayBtn"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" onclick="nextVideo()" style="width:32px;height:32px;font-size:0.8rem"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>

        <div class="footer">
            SoundFlow 音频优先播放器 · 使用 YouTube 后台音频流 · <a href="https://github.com" target="_blank">开源项目</a>
        </div>
    </main>
</div>

<!-- ADD VIDEO MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>
            添加视频到播放列表
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </h3>
        <div class="modal-hint">粘贴 YouTube 视频链接或视频 ID（支持 youtube.com 和 youtu.be 格式）</div>
        <input class="modal-input" id="modalUrlInput" type="text" placeholder="https://www.youtube.com/watch?v=VIDEO_ID">
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="addFromModal()"><i class="fas fa-plus"></i> 添加</button>
        </div>
    </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ===== VIDEO DATA =====
const defaultVideos = [
    { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', channel: 'Rick Astley', views: '1.6B', duration: '3:33' },
    { id: 'jNQXAC9IVRw', title: 'Me at the zoo - first YouTube video', channel: 'jawed', views: '324M', duration: '0:19' },
    { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE(¥Ê§Û¬¥Ê¥È¥Î¥È¥Î¥È¥Î) M/V', channel: 'officialpsy', views: '4.8B', duration: '4:13' },
    { id: 'kJQP7kiw5Fk', title: 'Luis Fonsi - Despacito ft. Daddy Yankee', channel: 'LuisFonsiVEVO', views: '8.2B', duration: '4:48' },
    { id: 'RgKAFK5djSk', title: 'Wiz Khalifa - See You Again ft. Charlie Puth', channel: 'WizKhalifaVEVO', views: '6.1B', duration: '3:52' },
    { id: 'fJ9rUzSTc1U', title: 'Queen - Bohemian Rhapsody (Official Video)', channel: 'QueenVEVO', views: '1.7B', duration: '5:55' },
    { id: 'OPf0YbXqDm0', title: 'Mark Ronson - Uptown Funk ft. Bruno Mars', channel: 'MarkRonsonVEVO', views: '4.6B', duration: '4:30' },
    { id: 'JB3L0HhM2F4', title: 'Pentatonix - Daft Punk', channel: 'Pentatonix', views: '332M', duration: '4:12' }
];

let videoList = [];
let currentIndex = -1;
let isPlaying = false;
let player = null;
let totalPlayTime = 0;
let playCount = 0;
let currentSpeed = 1.0;
let speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
let progressInterval = null;
let audioMode = true;
let vizBars = [];

// ===== YOUTUBE PLAYER =====
function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
        height: '1',
        width: '1',
        videoId: '',
        playerVars: {
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            playsinline: 1,
            enablejsapi: 1,
            origin: window.location.origin
        },
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerReady(event) {
    showToast('播放器已就绪，点击视频开始播放音频', 'success');
    createVisualizer();
    loadFromStorage();
    if (videoList.length === 0) videoList = [...defaultVideos];
    renderVideoList();
    loadThumbnails();
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playCount++;
        updatePlayUI();
        startProgressUpdater();
        showNwPBar();
        updateStats();
        startViz();
        if (currentIndex >= 0 && videoList[currentIndex]) {
            totalPlayTime += 1;
            saveToStorage();
        }
    } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        updatePlayUI();
        stopProgressUpdater();
        stopViz();
        if (event.data === YT.PlayerState.ENDED) {
            setTimeout(() => nextVideo(), 1000);
        }
    }
}

// ===== PLAYBACK CONTROLS =====
function playVideo(index) {
    if (index < 0 || index >= videoList.length) return;
    if (currentIndex >= 0 && currentIndex === index && player && player.getPlayerState) {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
            pauseVideo();
            return;
        } else if (state === YT.PlayerState.PAUSED) {
            resumeVideo();
            return;
        }
    }
    currentIndex = index;
    const video = videoList[index];
    if (player) {
        player.loadVideoById({ videoId: video.id, startSeconds: 0 });
        player.setVolume(parseInt(document.getElementById('volumeSlider').value));
        player.setPlaybackRate(currentSpeed);
        player.playVideo();
    }
    updatePlayerUI(video);
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('playerScreen').classList.remove('hidden');
    document.getElementById('nowPlayingBar').classList.add('show');
    showNwPBar();
}

function pauseVideo() {
    if (player) player.pauseVideo();
    isPlaying = false;
    updatePlayUI();
    stopProgressUpdater();
    stopViz();
}

function resumeVideo() {
    if (player) player.playVideo();
    isPlaying = true;
    updatePlayUI();
    startProgressUpdater();
    startViz();
}

function togglePlay() {
    if (currentIndex < 0) return;
    if (isPlaying) pauseVideo(); else resumeVideo();
}

function nextVideo() {
    if (videoList.length === 0) return;
    const next = (currentIndex + 1) % videoList.length;
    playVideo(next);
}

function prevVideo() {
    if (videoList.length === 0) return;
    if (player && player.getCurrentTime && player.getCurrentTime() > 3) {
        player.seekTo(0);
        return;
    }
    const prev = (currentIndex - 1 + videoList.length) % videoList.length;
    playVideo(prev);
}

function seekVideo(event) {
    if (!player || !isPlaying) return;
    const track = document.getElementById('progressTrack');
    const rect = track.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    const duration = player.getDuration();
    if (duration) player.seekTo(duration * pos);
}

function setVolume(val) {
    if (player) {
        player.setVolume(parseInt(val));
        const icon = document.getElementById('volIcon');
        if (val == 0) icon.className = 'fas fa-volume-xmark';
        else if (val < 40) icon.className = 'fas fa-volume-low';
        else icon.className = 'fas fa-volume-high';
    }
}

function cycleSpeed() {
    const idx = speeds.indexOf(currentSpeed);
    currentSpeed = speeds[(idx + 1) % speeds.length];
    if (player) player.setPlaybackRate(currentSpeed);
    document.getElementById('speedBtn').textContent = currentSpeed.toFixed(2) + 'x';
}

// ===== PROGRESS UPDATER =====
function startProgressUpdater() {
    stopProgressUpdater();
    progressInterval = setInterval(updateProgress, 250);
}

function stopProgressUpdater() {
    if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
}

function updateProgress() {
    if (!player || currentIndex < 0) return;
    const current = player.getCurrentTime() || 0;
    const duration = player.getDuration() || 1;
    const percent = (current / duration) * 100;

    document.getElementById('currentTime').textContent = formatTime(current);
    document.getElementById('totalTime').textContent = formatTime(duration);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('npCurrent').textContent = formatTime(current);
    document.getElementById('npTotal').textContent = formatTime(duration);
    document.getElementById('npProgressFill').style.width = percent + '%';

    // Estimate buffered
    const video = videoList[currentIndex];
    const estimatedVideoData = (duration / 3600) * 2500; // ~2500 kbps video
    const audioData = (duration / 3600) * 128; // ~128 kbps audio
    const saved = estimatedVideoData - audioData;
    document.getElementById('dataSaved').textContent = formatBytes(totalPlayTime > 0 ? totalPlayTime * (saved / 3600) * 0.001 : 0);
    document.getElementById('welcomeSaved').textContent = formatBytes(totalPlayTime * (saved / 3600) * 0.001);
}

// ===== UI UPDATES =====
function updatePlayUI() {
    const icon = document.getElementById('mainPlayIcon');
    const overlayIcon = document.getElementById('overlayPlayIcon');
    const npIcon = document.getElementById('npPlayBtn');
    if (isPlaying) {
        icon.className = 'fas fa-pause';
        overlayIcon.className = 'fas fa-pause';
        npIcon.innerHTML = '<i class="fas fa-pause"></i>';
    } else {
        icon.className = 'fas fa-play';
        overlayIcon.className = 'fas fa-play';
        npIcon.innerHTML = '<i class="fas fa-play"></i>';
    }
}

function updatePlayerUI(video) {
    document.getElementById('trackTitle').textContent = video.title;
    document.getElementById('trackChannel').textContent = video.channel;
    document.getElementById('albumArtImg').src = `https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`;
    document.getElementById('albumArtImg').onerror = function() {
        this.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
    };
    document.getElementById('npThumb').src = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;
    document.getElementById('npThumb').onerror = function() { this.src = ''; };
    document.getElementById('npTitle').textContent = video.title;
    document.getElementById('npChannel').textContent = video.channel;
    updatePlayUI();
}

function showNwPBar() {
    setTimeout(() => document.getElementById('nowPlayingBar').classList.add('show'), 100);
}

// ===== VISUALIZER =====
function createVisualizer() {
    const container = document.getElementById('visualizer');
    container.innerHTML = '';
    vizBars = [];
    for (let i = 0; i < 48; i++) {
        const bar = document.createElement('div');
        bar.className = 'viz-bar';
        bar.style.animationDelay = (Math.random() * 1).toFixed(2) + 's';
        const h = Math.random() * 60 + 10;
        bar.style.height = h + '%';
        container.appendChild(bar);
        vizBars.push(bar);
    }
}

function startViz() {
    if (!vizBars.length) return;
    const animate = () => {
        if (!isPlaying) return;
        vizBars.forEach(bar => {
            const h = Math.random() * 80 + 10;
            bar.style.height = h + '%';
            bar.style.opacity = 0.5 + Math.random() * 0.5;
        });
        setTimeout(animate, 200 + Math.random() * 300);
    };
    animate();
}

function stopViz() {
    // Reset bars to low
    vizBars.forEach(bar => { bar.style.height = (Math.random() * 15 + 5) + '%'; bar.style.opacity = 0.3; });
}

// ===== VIDEO LIST =====
function renderVideoList() {
    const container = document.getElementById('videoList');
    container.innerHTML = '';
    videoList.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-item' + (index === currentIndex ? ' active' : '');
        item.innerHTML = `
            <div class="thumb">
                <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}" loading="lazy"
                    onerror="this.style.display='none'">
                <span class="audio-badge"><i class="fas fa-headphones"></i> 音频</span>
                <span class="duration">${video.duration}</span>
            </div>
            <div class="video-info">
                <div class="video-title">${video.title}</div>
                <div class="video-meta">
                    <div>
                        <div class="video-channel">${video.channel}</div>
                        <div class="video-views">${video.views} 次观看</div>
                    </div>
                </div>
            </div>
        `;
        item.onclick = () => playVideo(index);
        container.appendChild(item);
    });
}

function filterVideos() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const items = document.querySelectorAll('.video-item');
    videoList.forEach((video, index) => {
        const match = video.title.toLowerCase().includes(query) || video.channel.toLowerCase().includes(query);
        if (items[index]) items[index].style.display = match ? '' : 'none';
    });
}

function loadThumbnails() {
    const imgs = document.querySelectorAll('.thumb img');
    imgs.forEach(img => {
        if (!img.src) {
            const item = img.closest('.video-item');
            const idx = Array.from(item.parentElement.children).indexOf(item);
            if (videoList[idx]) img.src = `https://img.youtube.com/vi/${videoList[idx].id}/mqdefault.jpg`;
        }
    });
}

// ===== ADD VIDEO =====
function openModal() {
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modalUrlInput').value = '';
    setTimeout(() => document.getElementById('modalUrlInput').focus(), 100);
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

function extractVideoId(url) {
    url = url.trim();
    if (!url) return null;
    // youtu.be/ID
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    // youtube.com/watch?v=ID
    m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    // youtube.com/embed/ID
    m = url.match(/embed\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    // just the ID if 11 chars
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    return null;
}

function addFromModal() {
    const url = document.getElementById('modalUrlInput').value;
    const id = extractVideoId(url);
    if (!id) { showToast('无效的YouTube链接', 'error'); return; }
    addVideo(id);
    closeModal();
}

function addFromQuickUrl() {
    const url = document.getElementById('quickUrl').value;
    const id = extractVideoId(url);
    if (!id) { showToast('无效的YouTube链接', 'error'); return; }
    addVideo(id);
    document.getElementById('quickUrl').value = '';
}

function addVideo(id) {
    if (videoList.find(v => v.id === id)) { showToast('该视频已在列表中', 'warning'); return; }
    const video = { id, title: '加载中...', channel: '加载中...', views: '...', duration: '...' };
    videoList.push(video);
    renderVideoList();
    showToast('视频已添加，正在加载信息...', 'info');
    // Fetch video metadata via YouTube oembed
    fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
        .then(r => r.json())
        .then(data => {
            const idx = videoList.findIndex(v => v.id === id);
            if (idx >= 0) {
                videoList[idx].title = data.title;
                videoList[idx].channel = data.author_name;
                videoList[idx].views = '';
            }
            renderVideoList();
        })
        .catch(() => {
            showToast('已添加视频，标题信息将在联网后更新', 'info');
        });
}

// ===== SIDEBAR =====
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
}

// ===== AUDIO MODE TOGGLE =====
document.getElementById('audioModeToggle').addEventListener('click', function() {
    audioMode = !audioMode;
    this.classList.toggle('active');
    showToast(audioMode ? '已启用纯音频模式' : '已切换为视频模式（将消耗更多流量）', audioMode ? 'success' : 'warning');
});

// ===== STORAGE =====
function saveToStorage() {
    try {
        const data = { videoList, totalPlayTime, playCount, currentSpeed };
        localStorage.setItem('soundflow_data', JSON.stringify(data));
    } catch(e) {}
}

function loadFromStorage() {
    try {
        const saved = localStorage.getItem('soundflow_data');
        if (saved) {
            const data = JSON.parse(saved);
            if (data.videoList && data.videoList.length > 0) {
                videoList = data.videoList;
            }
            totalPlayTime = data.totalPlayTime || 0;
            playCount = data.playCount || 0;
            currentSpeed = data.currentSpeed || 1.0;
            document.getElementById('speedBtn').textContent = currentSpeed.toFixed(2) + 'x';
        }
    } catch(e) {}
}

// ===== STATS =====
function updateStats() {
    document.getElementById('playingCount').textContent = playCount;
    saveToStorage();
}

// ===== UTILS =====
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function formatBytes(mb) {
    if (!mb || mb <= 0) return '0 MB';
    if (mb < 1) return '<1 MB';
    return mb.toFixed(1) + ' MB';
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: 'fa-check-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle', error: 'fa-times-circle' };
    const colors = { success: 'var(--success)', info: 'var(--accent-1)', warning: 'var(--warning)', error: 'var(--danger)' };
    toast.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'toastOut 0.3s forwards';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
        case 'Space':
            e.preventDefault();
            if (currentIndex >= 0) togglePlay();
            break;
        case 'ArrowRight':
            e.preventDefault();
            nextVideo();
            break;
        case 'ArrowLeft':
            e.preventDefault();
            prevVideo();
            break;
        case 'KeyM':
            document.getElementById('audioModeToggle').click();
            break;
        case 'Escape':
            closeModal();
            break;
    }
});

// ===== MODAL OVERLAY CLICK =====
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
    createVisualizer();
});
</script>
</body>
