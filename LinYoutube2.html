<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundFlow - 纯音频流媒体播放器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg-primary:#0a0a0f;--bg-secondary:#12121a;--bg-surface:#1a1a2e;
    --bg-hover:#252540;--text-primary:#ffffff;--text-secondary:#a0a0b8;
    --text-muted:#6c6c80;--accent-1:#7c3aed;--accent-2:#ec4899;
    --accent-gradient:linear-gradient(135deg,#7c3aed,#ec4899);
    --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
    --border:#2a2a40;--radius:12px;--radius-sm:8px;
    --shadow:0 8px 32px rgba(0,0,0,0.4)
}
html{font-size:16px}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;outline:none}
input{font-family:inherit;outline:none;border:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700}
.logo-icon{width:34px;height:34px;background:var(--accent-gradient);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.logo span{background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-stats{display:flex;align-items:center;gap:18px}
.stat-item{display:flex;align-items:center;gap:5px;font-size:0.82rem;color:var(--text-secondary)}
.stat-item i{color:var(--accent-1);font-size:0.85rem}
.stat-item .saved{color:var(--success);font-weight:600}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{padding:7px 14px;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:500;transition:var(--transition);display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--accent-gradient);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,0.4)}
.btn-ghost{background:var(--bg-surface);color:var(--text-secondary);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--text-secondary);transition:var(--transition)}
.btn-icon:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-sm{padding:5px 10px;font-size:0.78rem}
.btn-success{background:var(--success);color:#fff}
.btn-danger-ghost{color:var(--danger);padding:4px 8px;font-size:0.75rem}

/* APP LAYOUT */
.app{display:flex;height:100vh;padding-top:64px}
.sidebar{width:380px;min-width:380px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:var(--transition);position:relative}
.sidebar.collapsed{width:0;min-width:0;border:none}
.sidebar-toggle{position:absolute;top:74px;left:380px;z-index:90;width:26px;height:52px;background:var(--bg-surface);border:1px solid var(--border);border-left:none;border-radius:0 var(--radius-sm) var(--radius-sm) 0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:var(--transition);font-size:0.7rem}
.sidebar.collapsed~.sidebar-toggle{left:0}
.sidebar-toggle:hover{color:var(--text-primary);background:var(--bg-hover)}

/* SIDEBAR HEADER */
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.search-box{display:flex;align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;gap:8px;transition:var(--transition)}
.search-box:focus-within{border-color:var(--accent-1);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
.search-box i{color:var(--text-muted);font-size:0.85rem}
.search-box input{flex:1;background:none;color:var(--text-primary);font-size:0.88rem}
.search-box input::placeholder{color:var(--text-muted)}
.search-actions{display:flex;gap:8px}
.api-section{display:flex;gap:6px;align-items:center}
.api-input{flex:1;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text-primary);font-size:0.75rem}
.api-input::placeholder{color:var(--text-muted);font-size:0.72rem}
.api-status{font-size:0.7rem;padding:2px 8px;border-radius:10px;font-weight:500}
.api-status.ok{background:rgba(34,197,94,0.15);color:var(--success)}
.api-status.off{background:rgba(245,158,11,0.15);color:var(--warning)}

/* VIDEO LIST */
.video-list{flex:1;overflow-y:auto;padding:10px}
.video-item{display:flex;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);margin-bottom:4px;position:relative}
.video-item:hover{background:var(--bg-hover)}
.video-item.active{background:var(--bg-surface);border:1px solid var(--border)}
.video-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--accent-gradient);border-radius:0 2px 2px 0}
.thumb{width:140px;min-width:140px;height:80px;border-radius:6px;position:relative;overflow:hidden;background:var(--bg-primary);flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .duration{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.85);color:#fff;font-size:0.7rem;padding:1px 5px;border-radius:3px;font-weight:500}
.thumb .audio-badge{position:absolute;top:3px;left:3px;background:rgba(124,58,237,0.92);color:#fff;font-size:0.6rem;padding:2px 5px;border-radius:3px;font-weight:600;display:flex;align-items:center;gap:2px}
.thumb .search-badge{position:absolute;top:3px;left:3px;background:rgba(34,197,94,0.9);color:#fff;font-size:0.6rem;padding:2px 5px;border-radius:3px;font-weight:600}
.video-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.video-title{font-size:0.85rem;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text-primary)}
.video-channel{font-size:0.75rem;color:var(--text-muted);margin-top:3px}
.video-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.video-views{font-size:0.72rem;color:var(--text-muted)}
.video-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.7);color:#fff;font-size:0.6rem;display:none;align-items:center;justify-content:center;z-index:2}
.video-item:hover .video-remove{display:flex}
.video-remove:hover{background:var(--danger)}
.list-empty{padding:30px 20px;text-align:center;color:var(--text-muted);font-size:0.9rem}
.list-empty i{font-size:2rem;display:block;margin-bottom:10px;opacity:0.4}
.search-result-header{padding:8px 8px 4px;font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
.search-result-header .count{color:var(--accent-1);font-weight:600}

/* MAIN PLAYER */
.player-area{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg-primary);overflow:hidden}
.youtube-player{position:absolute;width:320px;height:180px;opacity:0;pointer-events:none;z-index:0}

/* WELCOME SCREEN */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;position:relative;z-index:2;padding:30px}
.welcome-icon{width:90px;height:90px;background:var(--accent-gradient);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome h2{font-size:1.7rem;background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text-muted);font-size:0.95rem;text-align:center;max-width:400px}
.equalizer{display:flex;align-items:flex-end;gap:4px;height:50px}
.eq-bar{width:5px;background:var(--accent-gradient);border-radius:3px;animation:eqBounce 0.8s ease-in-out infinite alternate}
.eq-bar:nth-child(1){height:18px;animation-delay:0s}
.eq-bar:nth-child(2){height:35px;animation-delay:0.1s}
.eq-bar:nth-child(3){height:28px;animation-delay:0.2s}
.eq-bar:nth-child(4){height:45px;animation-delay:0.3s}
.eq-bar:nth-child(5){height:22px;animation-delay:0.4s}
.eq-bar:nth-child(6){height:40px;animation-delay:0.5s}
.eq-bar:nth-child(7){height:30px;animation-delay:0.6s}
@keyframes eqBounce{0%{transform:scaleY(0.4)}100%{transform:scaleY(1)}}
.welcome-info-badges{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.data-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:500}
.data-badge.saved{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:var(--success)}
.data-badge.tip{background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:var(--accent-1)}
.hidden{display:none!important}

/* PLAYER SCREEN */
.player-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;position:relative;z-index:2;gap:28px}
.album-art{width:260px;height:260px;border-radius:var(--radius);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(124,58,237,0.3);animation:albumGlow 3s ease-in-out infinite}
@keyframes albumGlow{0%,100%{box-shadow:0 20px 60px rgba(124,58,237,0.3)}50%{box-shadow:0 20px 80px rgba(236,72,153,0.3)}}
.album-art img{width:100%;height:100%;object-fit:cover}
.album-art-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,15,0.8),transparent 60%)}
.album-art .play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);opacity:0;transition:var(--transition)}
.album-art:hover .play-overlay{opacity:1}
.play-overlay-btn{width:60px;height:60px;background:rgba(255,255,255,0.95);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--bg-primary);box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:var(--transition)}
.play-overlay-btn:hover{transform:scale(1.1)}
.track-info{text-align:center}
.track-title{font-size:1.5rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}
.track-channel{font-size:0.95rem;color:var(--text-muted)}
.data-saved-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:var(--success);padding:5px 14px;border-radius:20px;font-size:0.8rem;font-weight:500}

/* VISUALIZER */
.visualizer{display:flex;align-items:flex-end;gap:3px;height:70px;padding:0 16px}
.viz-bar{width:7px;border-radius:4px;background:var(--accent-gradient);animation:vizBounce 1s ease-in-out infinite alternate}
.viz-bar:nth-child(odd){animation-duration:0.6s}
.viz-bar:nth-child(3n){animation-duration:0.8s}
@keyframes vizBounce{0%{height:10%}100%{height:90%}}

/* PROGRESS */
.progress-section{padding:0 30px;width:100%;max-width:550px}
.progress-time{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--text-muted);margin-bottom:5px}
.progress-track{width:100%;height:5px;background:var(--bg-surface);border-radius:3px;cursor:pointer;position:relative;overflow:hidden;transition:height 0.15s}
.progress-track:hover{height:7px}
.progress-buffered{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,0.1);border-radius:3px}
.progress-fill{height:100%;background:var(--accent-gradient);border-radius:3px;position:relative;transition:width 0.1s linear;width:0%}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);opacity:0;transition:opacity 0.15s}
.progress-track:hover .progress-fill::after{opacity:1}

/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 0}
.ctrl-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:1.05rem;transition:var(--transition)}
.ctrl-btn:hover{color:var(--text-primary);background:var(--bg-hover)}
.ctrl-btn.play-main{width:54px;height:54px;background:var(--text-primary);color:var(--bg-primary);font-size:1.25rem}
.ctrl-btn.play-main:hover{transform:scale(1.08);box-shadow:0 4px 20px rgba(255,255,255,0.2)}
.volume-control{display:flex;align-items:center;gap:6px;margin-left:16px}
.volume-slider{-webkit-appearance:none;appearance:none;width:90px;height:4px;background:var(--bg-surface);border-radius:2px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer}
.volume-slider::-moz-range-thumb{width:13px;height:13px;background:#fff;border-radius:50%;border:none;box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer}
.playback-speed{padding:4px 10px;background:var(--bg-surface);border-radius:12px;font-size:0.76rem;color:var(--text-secondary);cursor:pointer;border:1px solid var(--border);transition:var(--transition)}
.playback-speed:hover{border-color:var(--accent-1);color:var(--text-primary)}

/* NOW PLAYING BAR */
.now-playing{position:absolute;bottom:0;left:0;right:0;z-index:50;background:rgba(18,18,26,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;transition:transform 0.3s;transform:translateY(100%)}
.now-playing.show{transform:translateY(0)}
.np-thumb{width:44px;height:44px;border-radius:6px;overflow:hidden;flex-shrink:0}
.np-thumb img{width:100%;height:100%;object-fit:cover}
.np-info{flex:1;min-width:0}
.np-title{font-size:0.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-channel{font-size:0.72rem;color:var(--text-muted)}
.np-controls{display:flex;align-items:center;gap:6px}
.np-progress{width:180px;display:flex;align-items:center;gap:6px}
.np-time{font-size:0.7rem;color:var(--text-muted);white-space:nowrap}
.np-progress .progress-track{height:3px}
.np-progress .progress-fill{height:100%}
.np-progress .progress-fill::after{display:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-surface);border-radius:var(--radius);padding:24px;width:100%;max-width:460px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal h3{font-size:1.15rem;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:var(--transition)}
.modal-close:hover{background:var(--bg-hover);color:var(--text-primary)}
.modal-input{width:100%;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:0.9rem;margin-bottom:8px}
.modal-input:focus{border-color:var(--accent-1)}
.modal-input::placeholder{color:var(--text-muted)}
.modal-hint{font-size:0.78rem;color:var(--text-muted);margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

/* SEARCH RESULTS DROPDOWN */
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);max-height:300px;overflow-y:auto;z-index:60;display:none;box-shadow:var(--shadow)}
.search-dropdown.show{display:block}
.search-dropdown-item{display:flex;gap:10px;padding:8px;cursor:pointer;transition:var(--transition);border-bottom:1px solid var(--border)}
.search-dropdown-item:last-child{border-bottom:none}
.search-dropdown-item:hover{background:var(--bg-hover)}
.sdi-thumb{width:100px;min-width:100px;height:60px;border-radius:4px;overflow:hidden;background:var(--bg-primary)}
.sdi-thumb img{width:100%;height:100%;object-fit:cover}
.sdi-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.sdi-title{font-size:0.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdi-channel{font-size:0.72rem;color:var(--text-muted);margin-top:2px}
.sdi-add{width:28px;height:28px;border-radius:50%;background:var(--accent-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;flex-shrink:0;align-self:center;transition:var(--transition)}
.sdi-add:hover{transform:scale(1.1)}
.search-loading{padding:20px;text-align:center;color:var(--text-muted);font-size:0.85rem}
.search-loading i{font-size:1.2rem;display:block;margin-bottom:6px;opacity:0.5}

/* TOAST */
.toast-container{position:fixed;top:76px;right:16px;z-index:300;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 16px;font-size:0.82rem;box-shadow:var(--shadow);animation:toastIn 0.3s ease-out;display:flex;align-items:center;gap:8px;min-width:220px}
.toast.success{border-left:3px solid var(--success)}
.toast.info{border-left:3px solid var(--accent-1)}
.toast.warning{border-left:3px solid var(--warning)}
.toast.error{border-left:3px solid var(--danger)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}

/* MODE TOGGLE */
.mode-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-surface);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);border:1px solid var(--border)}
.mode-toggle:hover{border-color:var(--accent-1)}
.mode-toggle.active{border-color:var(--accent-1);background:rgba(124,58,237,0.1)}
.toggle-dot{width:11px;height:11px;border-radius:50%;background:var(--text-muted);transition:var(--transition)}
.mode-toggle.active .toggle-dot{background:var(--success);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.mode-toggle span{font-size:0.8rem;color:var(--text-secondary)}
.mode-toggle.active span{color:var(--success)}

/* FOOTER */
.footer{position:absolute;bottom:56px;left:0;right:0;text-align:center;z-index:2;color:var(--text-muted);font-size:0.72rem;padding:6px}

/* RESPONSIVE */
@media(max-width:768px){
    .sidebar{width:100%;min-width:100%;position:absolute;left:0;top:64px;bottom:0;z-index:80}
    .sidebar.collapsed{transform:translateX(-100%)}
    .sidebar-toggle{display:none}
    .header-stats{display:none}
    .album-art{width:200px;height:200px}
    .np-progress{display:none}
    .progress-section{padding:0 16px}
    .np-progress{display:none}
    .volume-control{display:none}
    .visualizer{height:45px}
}
@media(max-width:480px){
    .album-art{width:170px;height:170px}
    .track-title{font-size:1.15rem}
    .controls{gap:12px}
    .ctrl-btn{width:36px;height:36px}
    .ctrl-btn.play-main{width:44px;height:44px}
    .thumb{width:120px;min-width:120px;height:70px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-left">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-headphones"></i></div>
            <span>SoundFlow</span>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <i class="fas fa-wifi"></i>
                <span>已节省</span>
                <span class="saved" id="dataSaved">0 MB</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-music"></i>
                <span>播放</span>
                <span id="playingCount">0</span>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <div class="mode-toggle active" id="audioModeToggle" title="音频优先模式 (M)">
            <div class="toggle-dot"></div>
            <span>纯音频</span>
        </div>

<script>
// ===================== STATE =====================
const defaultVideos = [
    { id:'dQw4w9WgXcQ', title:'Never Gonna Give You Up', channel:'Rick Astley', views:'1.6B', duration:'3:33' },
    { id:'jNQXAC9IVRw', title:'Me at the zoo - first YouTube video', channel:'jawed', views:'324M', duration:'0:19' },

    { id:'kJQP7kiw5Fk', title:'Luis Fonsi - Despacito ft. Daddy Yankee', channel:'LuisFonsiVEVO', views:'8.2B', duration:'4:48' },
    { id:'RgKAFK5djSk', title:'Wiz Khalifa - See You Again ft. Charlie Puth', channel:'WizKhalifaVEVO', views:'6.1B', duration:'3:52' },
    { id:'fJ9rUzSTc1U', title:'Queen - Bohemian Rhapsody', channel:'QueenVEVO', views:'1.7B', duration:'5:55' },
    { id:'OPf0YbXqDm0', title:'Mark Ronson - Uptown Funk ft. Bruno Mars', channel:'MarkRonsonVEVO', views:'4.6B', duration:'4:30' },
    { id:'JB3L0HhM2F4', title:'Pentatonix - Daft Punk', channel:'Pentatonix', views:'332M', duration:'4:12' }
];

let videoList = [];
let currentIndex = -1;
let isPlaying = false;
let player = null;
let totalPlayTime = 0;
let playCount = 0;
let currentSpeed = 1.0;
let speeds = [0.5,0.75,1.0,1.25,1.5,1.75,2.0];
let progressInterval = null;
let audioMode = true;
let vizBars = [];
let apiKey = '';
let searchDebounceTimer = null;
let searchQuery = '';

// ===================== YOUTUBE API SEARCH =====================
function searchYouTube(query, maxResults) {
    maxResults = maxResults || 10;
    if (!apiKey) return null; // No key available
    if (!query || query.trim().length === 0) return null;
    const params = new URLSearchParams({
        part: 'snippet,contentDetails,statistics',
        q: query.trim(),
        type: 'video',
        maxResults: maxResults,
        key: apiKey,
        regionCode: 'CN',
        videoCategoryId: '10' // Music category
    });
    const url = 'https://www.googleapis.com/youtube/v3/search?' + params.toString();
    return fetch(url).then(r => {
        if (!r.ok) throw new Error('API请求失败: ' + r.status);
        return r.json();
    }).then(data => {
        const results = (data.items || []).map(item => {
            const snippet = item.snippet;
            const dur = item.contentDetails?.duration || '';
            // parse ISO 8601 duration
            let duration = '...';
            if (dur) {
                const match = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                if (match) {
                    const h = match[1] ? parseInt(match[1]) : 0;
                    const m = match[2] ? parseInt(match[2]) : 0;
                    const s = match[3] ? parseInt(match[3]) : 0;
                    duration = (h ? h + ':' : '') + m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');
                }
            }
            return {
                id: item.id.videoId,
                title: snippet.title,
                channel: snippet.channelTitle,
                views: '',
                duration: duration,
                thumbnail: snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || ''
            };
        });
        return results;
    });
}

// ===================== DEMO SEARCH =====================
const demoSearchResults = [
    { id:'dQw4w9WgXcQ', title:'Never Gonna Give You Up', channel:'Rick Astley', views:'1.6B', duration:'3:33', thumbnail:'' },
    { id:'9bZkp7q19f0', title:'PSY - GANGNAM STYLE', channel:'officialpsy', views:'4.8B', duration:'4:13', thumbnail:'' },
    { id:'kJQP7kiw5Fk', title:'Luis Fonsi - Despacito ft. Daddy Yankee', channel:'LuisFonsiVEVO', views:'8.2B', duration:'4:48', thumbnail:'' },
    { id:'RgKAFK5djSk', title:'Wiz Khalifa - See You Again ft. Charlie Puth', channel:'WizKhalifaVEVO', views:'6.1B', duration:'3:52', thumbnail:'' },
    { id:'fJ9rUzSTc1U', title:'Queen - Bohemian Rhapsody', channel:'QueenVEVO', views:'1.7B', duration:'5:55', thumbnail:'' },
    { id:'OPf0YbXqDm0', title:'Mark Ronson - Uptown Funk ft. Bruno Mars', channel:'MarkRonsonVEVO', views:'4.6B', duration:'4:30', thumbnail:'' },
    { id:'JB3L0HhM2F4', title:'Pentatonix - Daft Punk', channel:'Pentatonix', views:'332M', duration:'4:12', thumbnail:'' },
    { id:'YQHsXMglC9A', title:'Lofi Hip Hop Radio - Beats to Relax/Study', channel:'Lofi Girl', views:'780M', duration:'', thumbnail:'' },
    { id:'JDHpUfk8m4o', title:'Alan Walker - Faded', channel:'walkervibe', views:'3.5B', duration:'3:32', thumbnail:'' },
    { id:'kJQP7kiw5Fk', title:'Luis Fonsi - Despacito', channel:'LuisFonsiVEVO', views:'8.2B', duration:'4:48', thumbnail:'' }
];

function doDemoSearch() {
    const query = searchQuery || '音乐';
    showSearchDropdownLoading();
    setTimeout(() => {
        const results = demoSearchResults.filter(v =>
            v.title.toLowerCase().includes(query.toLowerCase()) ||
            v.channel.toLowerCase().includes(query.toLowerCase())
        ).slice(0, 10);
        renderSearchDropdown(results, query);
    }, 600);
}

// ===================== SEARCH FUNCTIONALITY =====================
function onSearchInput(value) {
    searchQuery = value;
    if (!value || value.trim().length === 0) {
        hideSearchDropdown();
        return;
    }
    // Debounce
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        performSearch(value.trim());
    }, 400);
}

async function performSearch(query) {
    showSearchDropdownLoading();

    if (apiKey) {
        // Try YouTube API search
        try {
            const results = await searchYouTube(query, 10);
            if (results && results.length > 0) {
                renderSearchDropdown(results, query);
                return;
            }
            showSearchDropdownEmpty();
            return;
        } catch (e) {
            console.warn('API search failed, falling back to demo:', e);
            // Fall through to demo
        }
    }
    // Demo fallback
    setTimeout(() => {
        doDemoSearch();
    }, 500);
}

function renderSearchDropdown(results, query) {
    const dropdown = document.getElementById('searchDropdown');
    if (!results || results.length === 0) {
        showSearchDropdownEmpty();
        return;
    }
    let html = `<div class="search-result-header">找到 <span class="count">${results.length}</span> 个视频结果</div>`;
    results.forEach((video, idx) => {
        const thumbSrc = video.thumbnail || `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;
        html += `
        <div class="search-dropdown-item" onclick="addSearchResult('${video.id}')">
            <div class="sdi-thumb">
                <img src="${thumbSrc}" alt="${video.title}" loading="lazy"
                    onerror="this.style.display='none'">
            </div>
            <div class="sdi-info">
                <div class="sdi-title">${highlightMatch(video.title, query)}</div>
                <div class="sdi-channel">${video.channel}</div>
            </div>
            <div class="sdi-add" title="添加到列表"><i class="fas fa-plus"></i></div>
        </div>`;
    });
    html += `<div style="padding:8px;text-align:center;border-top:1px solid var(--border)">
        <button class="btn btn-sm btn-ghost" onclick="addAllSearchResults()"><i class="fas fa-layer-group"></i> 将全部结果加入列表</button>
    </div>`;
    dropdown.innerHTML = html;
    dropdown.classList.add('show');
}

function highlightMatch(text, query) {
    if (!query) return text;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return text;
    return text.substring(0, idx) + '<mark style="background:var(--accent-1);color:#fff;padding:0 2px;border-radius:2px">' + text.substring(idx, idx + query.length) + '</mark>' + text.substring(idx + query.length);
}

function showSearchDropdownLoading() {
    const dropdown = document.getElementById('searchDropdown');
    dropdown.innerHTML = `<div class="search-loading"><i class="fas fa-spinner fa-spin"></i>正在搜索 YouTube...</div>`;
    dropdown.classList.add('show');
}

function showSearchDropdownEmpty() {
    const dropdown = document.getElementById('searchDropdown');
    dropdown.innerHTML = `<div class="search-loading"><i class="fas fa-search"></i>没有找到匹配的视频</div>`;
    dropdown.classList.add('show');
}

function hideSearchDropdown() {
    document.getElementById('searchDropdown').classList.remove('show');
}

function addSearchResult(videoId) {
    hideSearchDropdown();
    if (videoList.find(v => v.id === videoId)) {
        showToast('该视频已在列表中', 'warning');
        return;
    }
    addVideoById(videoId);
}

function addAllSearchResults() {
    hideSearchDropdown();
    // Add all unique results from demo list
    const query = searchQuery || '';
    const toAdd = demoSearchResults.filter(v =>
        (v.title.toLowerCase().includes(query.toLowerCase()) || v.channel.toLowerCase().includes(query.toLowerCase())) &&
        !videoList.find(existing => existing.id === v.id)
    ).slice(0, 10);
    if (toAdd.length === 0) {
        showToast('没有新视频可添加', 'warning');
        return;
    }
    toAdd.forEach(v => {
        videoList.push({ id: v.id, title: v.title, channel: v.channel, views: v.views, duration: v.duration });
    });
    renderVideoList();
    loadThumbnails();
    showToast(`已添加 ${toAdd.length} 个视频到列表`, 'success');
    saveToStorage();
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    hideSearchDropdown();
}

// ===================== ADD VIDEO =====================
async function addVideoById(id) {
    const video = { id, title: '加载中...', channel: '加载中...', views: '', duration: '...' };
    videoList.push(video);
    renderVideoList();
    showToast('正在获取视频信息...', 'info');

    // Try to get metadata via oEmbed (no key needed)
    try {
        const resp = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        if (resp.ok) {
            const data = await resp.json();
            const idx = videoList.findIndex(v => v.id === id);
            if (idx >= 0) {
                videoList[idx].title = data.title;
                videoList[idx].channel = data.author_name;
                // Try to parse duration from URL or fetch it
            }
            renderVideoList();
        }
    } catch (e) {
        // oEmbed failed, that's ok
    }

    // Try to get duration via YouTube API if key available
    if (apiKey) {
        try {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${id}&key=${apiKey}`;
            const resp = await fetch(url);
            if (resp.ok) {
                const data = await resp.json();
                if (data.items && data.items.length > 0) {
                    const item = data.items[0];
                    const dur = item.contentDetails?.duration || '';
                    const stats = item.statistics || {};
                    let duration = '...';
                    if (dur) {
                        const match = dur.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                        if (match) {
                            const h = match[1] ? parseInt(match[1]) : 0;
                            const m = match[2] ? parseInt(match[2]) : 0;
                            const s = match[3] ? parseInt(match[3]) : 0;
                            duration = (h ? h + ':' : '') + m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0');
                        }
                    }
                    const idx = videoList.findIndex(v => v.id === id);
                    if (idx >= 0) {
                        videoList[idx].duration = duration;
                        videoList[idx].views = stats.viewCount ? formatViews(stats.viewCount) : '';
                    }
                    renderVideoList();
                }
            }
        } catch(e) { /* ignore */ }
    }
}

function formatViews(n) {
    n = parseInt(n);
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toString();
}

function addFromModal() {
    const url = document.getElementById('modalUrlInput').value;
    const id = extractVideoId(url);
    if (!id) { showToast('无效的 YouTube 链接', 'error'); return; }
    addVideoById(id);
    closeModal();
}

function addFromQuickUrl() {
    const url = document.getElementById('quickUrl').value;
    const id = extractVideoId(url);
    if (!id) { showToast('无效的 YouTube 链接', 'error'); return; }
    addVideoById(id);
    document.getElementById('quickUrl').value = '';
}

function extractVideoId(url) {
    url = url.trim();
    if (!url) return null;
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = url.match(/embed\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = url.match(/shorts\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    return null;
}

// ===================== API KEY =====================
function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
        showToast('请输入 API Key', 'warning');
        return;
    }
    apiKey = key;
    localStorage.setItem('soundflow_apikey', key);
    document.getElementById('apiStatus').textContent = '在线';
    document.getElementById('apiStatus').className = 'api-status ok';
    showToast('API Key 已保存', 'success');
}

// ===================== PLAYBACK CONTROLS =====================
function playVideo(index) {
    if (index < 0 || index >= videoList.length) return;
    currentIndex = index;
    const video = videoList[index];
    if (player) {
        player.loadVideoById({ videoId: video.id, startSeconds: 0 });
        player.setVolume(parseInt(document.getElementById('volumeSlider').value));
        player.setPlaybackRate(currentSpeed);
        player.playVideo();
    }
    updatePlayerUI(video);
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('playerScreen').classList.remove('hidden');
    document.getElementById('nowPlayingBar').classList.add('show');
}

function pauseVideo() {
    if (player) player.pauseVideo();
    isPlaying = false;
    updatePlayUI();
    stopProgressUpdater();
    stopViz();
}

function resumeVideo() {
    if (player) player.playVideo();
    isPlaying = true;
    updatePlayUI();
    startProgressUpdater();
    startViz();
}

function togglePlay() {
    if (currentIndex < 0) return;
    if (isPlaying) pauseVideo(); else resumeVideo();
}

function nextVideo() {
    if (videoList.length === 0) return;
    const next = (currentIndex + 1) % videoList.length;
    playVideo(next);
}

function prevVideo() {
    if (videoList.length === 0) return;
    if (player && player.getCurrentTime && player.getCurrentTime() > 3) {
        player.seekTo(0);
        return;
    }
    const prev = (currentIndex - 1 + videoList.length) % videoList.length;
    playVideo(prev);
}

function seekVideo(event) {
    if (!player || !isPlaying) return;
    const track = document.getElementById('progressTrack');
    const rect = track.getBoundingClientRect();
    const pos = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    const duration = player.getDuration();
    if (duration) player.seekTo(duration * pos);
}

function setVolume(val) {
    if (player) player.setVolume(parseInt(val));
    const icon = document.getElementById('volIcon');
    if (val == 0) icon.className = 'fas fa-volume-xmark';
    else if (val < 40) icon.className = 'fas fa-volume-low';
    else icon.className = 'fas fa-volume-high';
}

function cycleSpeed() {
    const idx = speeds.indexOf(currentSpeed);
    currentSpeed = speeds[(idx + 1) % speeds.length];
    if (player) player.setPlaybackRate(currentSpeed);
    document.getElementById('speedBtn').textContent = currentSpeed.toFixed(2) + 'x';
}

// ===================== PROGRESS =====================
function startProgressUpdater() {
    stopProgressUpdater();
    progressInterval = setInterval(updateProgress, 250);
}

function stopProgressUpdater() {
    if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
}

function updateProgress() {
    if (!player || currentIndex < 0) return;
    const current = player.getCurrentTime() || 0;
    const duration = player.getDuration() || 1;
    const percent = duration > 0 ? (current / duration) * 100 : 0;

    document.getElementById('currentTime').textContent = formatTime(current);
    document.getElementById('totalTime').textContent = formatTime(duration);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('npCurrent').textContent = formatTime(current);
    document.getElementById('npTotal').textContent = formatTime(duration);
    document.getElementById('npProgressFill').style.width = percent + '%';

    const savedPerHour = (2500 - 128) * 0.001; // MB per hour saved
    const savedMB = totalPlayTime > 0 ? totalPlayTime * (savedPerHour / 3600) : 0;
    document.getElementById('dataSaved').textContent = formatBytes(savedMB);
    document.getElementById('welcomeSaved').textContent = formatBytes(savedMB);
}

// ===================== UI UPDATES =====================
function updatePlayUI() {
    const icon = 'mainPlayIcon';
    const ids = { mainPlayIcon: 'mainPlayIcon', overlayPlayIcon: 'overlayPlayIcon', npPlayBtn: 'npPlayBtn' };
    const classes = isPlaying ? 'fas fa-pause' : 'fas fa-play';
    document.getElementById('mainPlayIcon').className = classes;
    document.getElementById('overlayPlayIcon').className = classes;
    document.getElementById('npPlayBtn').innerHTML = `<i class="${classes}"></i>`;
}

function updatePlayerUI(video) {
    document.getElementById('trackTitle').textContent = video.title;
    document.getElementById('trackChannel').textContent = video.channel;
    const img = document.getElementById('albumArtImg');
    img.src = `https://img.youtube.com/vi/${video.id}/maxresdefault.jpg`;
    img.onerror = () => { img.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`; };
    document.getElementById('npThumb').src = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;
    updatePlayUI();
}

// ===================== VIDEO LIST RENDERING =====================
function renderVideoList() {
    const container = document.getElementById('videoList');
    if (videoList.length === 0) {
        container.innerHTML = `<div class="list-empty"><i class="fas fa-video-slash"></i>播放列表为空<br><small>在上方搜索栏搜索视频，或点击"添加"按钮</small></div>`;
        return;
    }
    container.innerHTML = '';
    videoList.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = 'video-item' + (index === currentIndex ? ' active' : '');
        item.innerHTML = `
            <div class="thumb">
                <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}" loading="lazy"
                    onerror="this.style.display='none'">
                <span class="audio-badge"><i class="fas fa-headphones"></i> 音频</span>
                <span class="duration">${video.duration || '...'}</span>
            </div>
            <div class="video-info">
                <div class="video-title">${video.title}</div>
                <div class="video-meta">
                    <div>
                        <div class="video-channel">${video.channel || '未知频道'}</div>
                        <div class="video-views">${video.views ? video.views + ' 次观看' : ''}</div>
                    </div>
                </div>
            </div>
            <div class="video-remove" onclick="event.stopPropagation();removeVideo(${index})"><i class="fas fa-times"></i></div>
        `;
        item.onclick = () => playVideo(index);
        container.appendChild(item);
    });
}

function removeVideo(index) {
    if (index < 0 || index >= videoList.length) return;
    videoList.splice(index, 1);
    if (currentIndex === index) {
        pauseVideo();
        document.getElementById('playerScreen').classList.add('hidden');
        document.getElementById('nowPlayingBar').classList.remove('show');
        document.getElementById('welcomeScreen').classList.remove('hidden');
        currentIndex = -1;
    } else if (currentIndex > index) {
        currentIndex--;
    }
    renderVideoList();
    saveToStorage();
    showToast('视频已移除', 'info');
}

function loadThumbnails() {
    // Thumbnails are loaded inline now, nothing to do here
}

// ===================== MODE TOGGLE =====================
document.getElementById('audioModeToggle').addEventListener('click', function() {
    audioMode = !audioMode;
    this.classList.toggle('active');
    showToast(audioMode ? '已启用纯音频模式' : '已切换为视频模式（将消耗更多流量）', audioMode ? 'success' : 'warning');
});

// ===================== SIDEBAR =====================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
}

// ===================== STORAGE =====================
function saveToStorage() {
    try {
        const data = { videoList, totalPlayTime, playCount, currentSpeed, apiKey };
        localStorage.setItem('soundflow_data', JSON.stringify(data));
    } catch(e) {}
}

function loadFromStorage() {
    try {
        const saved = localStorage.getItem('soundflow_data');
        if (saved) {
            const data = JSON.parse(saved);
            if (data.videoList && data.videoList.length > 0) videoList = data.videoList;
            totalPlayTime = data.totalPlayTime || 0;
            playCount = data.playCount || 0;
            currentSpeed = data.currentSpeed || 1.0;
            apiKey = data.apiKey || '';
            if (apiKey) {
                document.getElementById('apiKeyInput').value = apiKey;
                document.getElementById('apiStatus').textContent = '在线';
                document.getElementById('apiStatus').className = 'api-status ok';
            }
            document.getElementById('speedBtn').textContent = currentSpeed.toFixed(2) + 'x';
        }
    } catch(e) {}
}

// ===================== STATS =====================
function updateStats() {
    document.getElementById('playingCount').textContent = playCount;
    saveToStorage();
}

// ===================== VISUALIZER =====================
function createVisualizer() {
    const container = document.getElementById('visualizer');
    container.innerHTML = '';
    vizBars = [];
    for (let i = 0; i < 48; i++) {
        const bar = document.createElement('div');
        bar.className = 'viz-bar';
        bar.style.animationDelay = (Math.random() * 1).toFixed(2) + 's';
        bar.style.height = (Math.random() * 15 + 5) + '%';
        container.appendChild(bar);
        vizBars.push(bar);
    }
}

function startViz() {
    if (!vizBars.length) return;
    const animate = () => {
        if (!isPlaying) return;
        vizBars.forEach(bar => {
            bar.style.height = (Math.random() * 80 + 10) + '%';
            bar.style.opacity = 0.5 + Math.random() * 0.5;
        });
        setTimeout(animate, 200 + Math.random() * 300);
    };
    animate();
}

function stopViz() {
    vizBars.forEach(bar => { bar.style.height = (Math.random() * 15 + 5) + '%'; bar.style.opacity = 0.3; });
}

// ===================== YOUTUBE PLAYER EVENTS =====================
function onYouTubeIframeAPIReady() {
    player = new YT.Player('youtube-player', {
        height: '1', width: '1', videoId: '',
        playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, rel:0, showinfo:0, playsinline:1, enablejsapi:1, origin:window.location.origin },
        events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange }
    });
}

function onPlayerReady(event) {
    showToast('播放器已就绪', 'success');
    createVisualizer();
    loadFromStorage();
    if (videoList.length === 0) videoList = [...defaultVideos];
    renderVideoList();
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playCount++;
        updatePlayUI();
        startProgressUpdater();
        showNwPBar();
        updateStats();
        startViz();
        if (currentIndex >= 0 && videoList[currentIndex]) { totalPlayTime += 1; saveToStorage(); }
    } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        updatePlayUI();
        stopProgressUpdater();
        stopViz();
        if (event.data === YT.PlayerState.ENDED) setTimeout(() => nextVideo(), 1000);
    }
}

// ===================== KEYBOARD =====================
document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
        case 'Space': e.preventDefault(); if (currentIndex >= 0) togglePlay(); break;
        case 'ArrowRight': e.preventDefault(); nextVideo(); break;
        case 'ArrowLeft': e.preventDefault(); prevVideo(); break;
        case 'KeyM': document.getElementById('audioModeToggle').click(); break;
        case 'Escape': closeModal(); break;
    }
});

// ===================== MODAL =====================
function openModal() {
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('modalUrlInput').value = '';
    setTimeout(() => document.getElementById('modalUrlInput').focus(), 100);
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ===================== TIME FORMAT =====================
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function formatBytes(mb) {
    if (!mb || mb <= 0) return '0 MB';
    if (mb < 1) return '<1 MB';
    return mb.toFixed(1) + ' MB';
}

// ===================== TOAST =====================
function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success:'fa-check-circle', info:'fa-info-circle', warning:'fa-exclamation-triangle', error:'fa-times-circle' };
    const colors = { success:'var(--success)', info:'var(--accent-1)', warning:'var(--warning)', error:'var(--danger)' };
    toast.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]}"></i> ${message}`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.animation = 'toastOut 0.3s forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
}

function showNwPBar() { setTimeout(() => document.getElementById('nowPlayingBar').classList.add('show'), 100); }

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', createVisualizer);
</script>
